name: tests

on:
  push:
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit + integration tests with coverage
        run: npm run test:coverage

      # E2E (Playwright) is intentionally NOT run here: it needs real browser
      # engines and a deployed backend (the app is a static export). Run it
      # locally against a deployment with `npm run e2e` — see e2e/README.md.
